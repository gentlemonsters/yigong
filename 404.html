<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2B0626">
<title>页面走丢了 · 南开义工之家</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
  color:#F7EFF6;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(800px 620px at 50% 34%, rgba(146,36,128,.5), transparent 68%),
    linear-gradient(170deg,#3B0A34 0%,#2C0626 48%,#220420 100%);
}
.box{max-width:420px}
.mark{
  width:64px;height:64px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
  font-family:"Songti SC","STSong","SimSun",serif;font-size:28px;color:#E3C08D;
  border:1px solid rgba(227,192,141,.55);box-shadow:0 0 0 8px rgba(227,192,141,.08);
}
h1{margin:0 0 12px;font-family:"Songti SC","STSong","SimSun",serif;font-size:24px;letter-spacing:.14em;font-weight:600}
p{margin:0 0 26px;font-size:13.5px;line-height:2;color:rgba(247,239,246,.66)}
a{
  display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 30px;
  border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:.16em;
  color:#3A0A32;background:linear-gradient(135deg,#F2DAB6,#D2A45F);
  box-shadow:0 12px 30px rgba(0,0,0,.34);
}
.foot{margin-top:34px;font-size:11px;letter-spacing:.24em;color:rgba(247,239,246,.34)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">义</div>
    <h1>这一页不见了</h1>
    <p>可能是链接写错了，或者页面已经搬走。<br>回到首页，从通知开始看起。</p>
    <a href="./index.html">回到首页</a>
    <div class="foot">允公允能　日新月异</div>
  </div>
</body>
</html>
